<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>ALCS 2026</title>
    <style>
        /* Base Styles & Responsive Watermark */
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 40px 20px;
            background-color: #f4f6f9;
            min-height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('./ALCS.png');
            background-repeat: no-repeat;
            background-position: center;
            /* clamp(minimum_size, preferred_size, maximum_size) */
            /* This ensures it scales fluidly but never gets too tiny or too huge */
            background-size: clamp(280px, 60vw, 900px); 
            opacity: 0.08; 
            z-index: -1; 
        }

        /* Headers */
        .header-container {
            text-align: center;
            margin-bottom: 40px;
            z-index: 1;
            padding: 0 10px;
        }

        .main-title {
            margin: 0;
            font-size: clamp(1.6rem, 4vw, 2.2rem); /* Fluid typography for the title */
            font-weight: 700;
            color: #005a9e;
        }

        .sub-title {
            margin: 10px 0 0 0;
            font-size: clamp(1.1rem, 2vw, 1.4rem);
            font-weight: 500;
            color: #444;
        }

        /* Responsive Layout for the two sections */
        .cards-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            max-width: 1100px;
            width: 100%;
            justify-content: center;
            z-index: 1;
        }

        .section-card {
            /* flex: grow shrink base-width */
            flex: 1 1 300px; 
            background-color: rgba(255, 255, 255, 0.75); 
            border: 1px solid #d1d9e6;
            border-radius: 12px;
            padding: 30px 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        .section-title {
            margin: 0 0 25px 0;
            font-size: 1.3rem;
            font-weight: 600;
            color: #004578;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-align: center;
        }

        /* Fluid Grid layout for buttons inside cards */
        .button-grid {
            display: grid;
            /* Auto-fit creates as many columns as will fit at the minimum width (150px) */
            /* If they can't fit, it drops them to the next row perfectly */
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            width: 100%;
        }

        .tile-button {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%; 
            min-height: 80px;
            background-color: #1a65a3;
            color: white;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            text-decoration: none;
            padding: 15px;
            box-sizing: border-box;
            border: 2px solid #85b4d9; 
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.15);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .tile-button:hover {
            background-color: #134e80;
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1 class="main-title">African Logistics and Communications Symposium</h1>
        <h2 class="sub-title">ALCS 2026</h2>
    </div>

    <div class="cards-wrapper">
        
        <!-- Logistics Section Card -->
        <div class="section-card">
            <h3 class="section-title">🚚 Logistics Surveys</h3>
            
            <div class="button-grid">
                <a href="https://forms.office.com/r/EGz9Qii1DG" target="_blank" rel="noopener noreferrer" class="tile-button">
                    WALC Overall Survey
                </a>
                <a href="https://forms.office.com/r/jmGpLeJ8qu" target="_blank" rel="noopener noreferrer" class="tile-button">
                    Industry Survey
                </a>
                <a href="https://forms.office.com/r/d9qKcUYHz2" target="_blank" rel="noopener noreferrer" class="tile-button">
                    Day 1 Panel Surveys
                </a>
                <a href="https://forms.office.com/r/4661ZppM3W" target="_blank" rel="noopener noreferrer" class="tile-button">
                    Day 2 Panel Surveys
                </a>
                <a href="https://forms.office.com/r/QRQaGMEnrV" target="_blank" rel="noopener noreferrer" class="tile-button">
                    Day 3 Panel Surveys
                </a>
            </div>
        </div>

        <!-- Communications Section Card -->
        <div class="section-card">
            <h3 class="section-title">📡 Communications Surveys</h3>
            
            <div class="button-grid">
                <a href="https://forms.cloud.microsoft/r/LUrUyXA2JG" target="_blank" rel="noopener noreferrer" class="tile-button">
                    Overall Survey
                </a>
            </div>
        </div>

    </div>

</body>
</html>
