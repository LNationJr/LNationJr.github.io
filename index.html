<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>ALCS 2026</title>
    <style>
        /* Base Styles & Responsive Watermark */
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 40px 20px;
            background-color: #f4f6f9;
            min-height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('./ALCS.png');
            background-repeat: no-repeat;
            background-position: center;
            background-size: clamp(280px, 60vw, 900px); 
            opacity: 0.08; 
            z-index: -1; 
        }

        /* Headers */
        .header-container {
            text-align: center;
            margin-bottom: 40px;
            z-index: 1;
            padding: 0 10px;
        }

        .main-title {
            margin: 0;
            font-size: clamp(1.6rem, 4vw, 2.2rem); 
            font-weight: 700;
            color: #005a9e;
        }

        .sub-title {
            margin: 10px 0 0 0;
            font-size: clamp(1.1rem, 2vw, 1.4rem);
            font-weight: 500;
            color: #444;
        }

        /* Responsive Layout for the sections */
        .cards-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            max-width: 1100px;
            width: 100%;
            justify-content: center;
            z-index: 1;
        }

        .section-card {
            flex: 1 1 300px; 
            background-color: rgba(255, 255, 255, 0.75); 
            border: 1px solid #d1d9e6;
            border-radius: 12px;
            padding: 30px 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        .section-title {
            margin: 0 0 25px 0;
            font-size: 1.3rem;
            font-weight: 600;
            color: #004578;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-align: center;
        }

        /* Fluid Grid layout for buttons inside cards */
        .button-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            width: 100%;
        }

        .tile-button {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%; 
            min-height: 80px;
            background-color: #1a65a3;
            color: white;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            text-decoration: none;
            padding: 15px;
            box-sizing: border-box;
            border: 2px solid #85b4d9; 
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.15);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .tile-button:hover {
            background-color: #134e80;
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        }

        /* --- NEW: Disabled State Styles --- */
        
        .disabled-card {
            background-color: rgba(240, 240, 240, 0.6);
            border: 1px solid #e0e0e0;
            box-shadow: none;
        }

        .disabled-card .section-title {
            color: #888;
            margin-bottom: 10px; /* Reduced margin to make room for the message */
        }

        .disabled-message {
            font-size: 0.95rem;
            color: #666;
            text-align: center;
            margin: 0 0 25px 0;
            font-style: italic;
        }

        .disabled-button {
            background-color: #cccccc;
            color: #777777;
            border: 2px solid #bbbbbb;
            box-shadow: none;
            cursor: not-allowed;
            pointer-events: none; /* This completely prevents clicking the links */
        }

        .disabled-button:hover {
            background-color: #cccccc;
            transform: none;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1 class="main-title">African Logistics and Communications Symposium</h1>
        <h2 class="sub-title">ALCS 2026</h2>
    </div>

    <div class="cards-wrapper">
        
        <!-- Agenda Section Card (Active) -->
        <div class="section-card">
            <h3 class="section-title">📅 Symposium Agenda</h3>
            
            <div class="button-grid">
                <a href="agenda.pdf#toolbar=0" target="_blank" rel="noopener noreferrer" class="tile-button">
                    View Latest Agenda
                </a>
            </div>
        </div>

        <!-- Logistics Section Card (Disabled) -->
        <div class="section-card disabled-card">
            <h3 class="section-title">🚚 Logistics Surveys</h3>
            <p class="disabled-message">*Surveys will be available at the end of the symposium*</p>
            
            <div class="button-grid">
                <a href="#" target="_blank" rel="noopener noreferrer" class="tile-button disabled-button">
                    US Survey
                </a>
                <a href="#" target="_blank" rel="noopener noreferrer" class="tile-button disabled-button">
                    Partners Survey
                </a>
            </div>
        </div>

        <!-- Communications Section Card (Disabled) -->
        <div class="section-card disabled-card">
            <h3 class="section-title">📡 Communications Surveys</h3>
            <p class="disabled-message">*Surveys will be available at the end of symposium*</p>
            
            <div class="button-grid">
                <a href="https://forms.cloud.microsoft/r/LUrUyXA2JG" target="_blank" rel="noopener noreferrer" class="tile-button disabled-button">
                    Survey
                </a>
            </div>
        </div>

    </div>

</body>
</html>
